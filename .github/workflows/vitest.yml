name: vitest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        id: vitest
        run: bun run test -- --reporter=default --reporter=junit --outputFile=junit.xml --reporter=github-actions

      # Artifacts to be consumed by the Test Results workflow (vitest-results.yml)

      - name: Upload test artifacts
        if: (!cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: |
            junit.xml
          retention-days: 30

      - name: Upload Event File
        if: (!cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: Event File
          path: ${{ github.event_path }}

  publish_call:
    name: "Publish"
    if: false
    # needs: [test]
    # # we run the action from this branch whenever we can (when it runs in our repo's context)
    # if: >
    #   ! cancelled() &&
    #   github.event.sender.login != 'dependabot[bot]' &&
    #   ( github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository )
    uses: "./.github/workflows/vitest-results.yml"
    permissions:
      checks: write
      pull-requests: write
      security-events: write
      actions: read

  publish_inline:
    name: Test Results
    runs-on: ubuntu-latest
    needs: test

    permissions:
      checks: write

      # needed unless run with comment_mode: off
      pull-requests: write

      # required by download step to access artifacts API
      actions: read

    steps:
      - name: Download and Extract Artifacts
        uses: dawidd6/action-download-artifact@e7466d1a7587ed14867642c2ca74b5bcc1e19a2d
        with:
           path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          commit: ${{ github.ref }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event_name }}
          files: "artifacts/**/*.xml"
